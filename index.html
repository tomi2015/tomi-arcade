<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tomi Arcade</title>
<meta name="description" content="Los juegos de tomi2015. Entra, elige una máquina y juega.">
<meta property="og:title" content="Tomi Arcade">
<meta property="og:description" content="Los juegos de tomi2015. Entra, elige una máquina y juega.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230c0910'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23f0a53a'/%3E%3Cg stroke='%23f0a53a' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M16 3v4M16 25v4M3 16h4M25 16h4M6.5 6.5l3 3M22.5 22.5l3 3M25.5 6.5l-3 3M9.5 22.5l-3 3'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0c0910; --bg-2:#14101d; --panel:#171320; --line:#2a2338;
    --ink:#efe7d8; --dim:#8a8098; --dimmer:#5c5470;
    --amber:#f0a53a; --amber-deep:#8a5a17; --pink:#e24a72;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Fredoka',system-ui,-apple-system,sans-serif;
    font-weight:400; line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
    background-image:
      radial-gradient(900px 500px at 80% -10%, rgba(240,165,58,.10), transparent 70%),
      radial-gradient(700px 500px at 0% 100%, rgba(226,74,114,.08), transparent 70%);
    background-attachment:fixed;
  }
  ::selection{background:var(--amber);color:#1a1206}
  a{color:inherit}

  .wrap{max-width:1080px;margin:0 auto;padding:0 clamp(18px,5vw,40px)}

  /* ---------- header ---------- */
  header{padding:26px 0 6px}
  .brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .brand .mark{
    font-family:'Bungee',cursive;font-size:clamp(20px,3.4vw,26px);
    letter-spacing:.02em;color:var(--ink);
  }
  .brand .mark b{color:var(--amber)}
  .brand .by{
    font-family:'DM Mono',monospace;font-size:12px;color:var(--dim);
    letter-spacing:.02em;
  }
  .brand .by a{color:var(--dim);text-decoration:none;border-bottom:1px solid var(--line)}
  .brand .by a:hover{color:var(--amber);border-color:var(--amber)}

  /* ---------- hero ---------- */
  .hero{padding:clamp(46px,10vw,96px) 0 clamp(30px,6vw,54px)}
  .hero .eyebrow{
    font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.28em;
    text-transform:uppercase;color:var(--amber);margin-bottom:18px;
  }
  .hero h1{
    font-family:'Bungee',cursive;font-weight:400;
    font-size:clamp(44px,12vw,116px);line-height:.92;
    text-wrap:balance;letter-spacing:-.01em;
    color:var(--ink);
    text-shadow:
      4px 4px 0 #000,
      0 0 34px rgba(240,165,58,.16);
  }
  .hero h1 .flick{color:var(--amber)}
  .hero p.lead{
    margin-top:22px;max-width:46ch;font-size:clamp(15px,2vw,18px);
    color:var(--dim);
  }
  .hero .lead b{color:var(--ink);font-weight:500}

  /* ---------- games ---------- */
  .section-head{
    display:flex;align-items:center;gap:16px;
    margin:14px 0 26px;
  }
  .section-head h2{
    font-family:'Bungee',cursive;font-weight:400;font-size:clamp(16px,2.4vw,20px);
    letter-spacing:.04em;color:var(--ink);white-space:nowrap;
  }
  .section-head .rule{flex:1;height:2px;background:linear-gradient(90deg,var(--line),transparent)}
  .section-head .count{font-family:'DM Mono',monospace;font-size:12px;color:var(--dim)}

  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));
    gap:clamp(18px,3vw,28px);padding-bottom:70px;
  }

  .card{
    display:flex;flex-direction:column;
    background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);overflow:hidden;
    transition:transform .16s ease, border-color .16s ease, box-shadow .16s ease;
  }
  .card:hover{
    transform:translateY(-4px);
    border-color:var(--card-accent,var(--amber));
    box-shadow:0 18px 44px -18px rgba(0,0,0,.8);
  }

  .poster{
    position:relative;aspect-ratio:16/10;
    display:grid;place-items:center;
    background:linear-gradient(150deg,var(--g1,#241a3a),var(--g2,#150e22));
    border-bottom:1px solid var(--line);
    overflow:hidden;
  }
  .poster .motif{
    position:absolute;font-size:clamp(120px,26vw,200px);line-height:1;
    opacity:.14;filter:saturate(.7);
    transform:rotate(-8deg);pointer-events:none;user-select:none;
  }
  .poster .plate{
    position:relative;text-align:center;padding:0 18px;z-index:2;
  }
  .poster .plate .t{
    font-family:'Bungee',cursive;font-size:clamp(20px,4.4vw,30px);line-height:1;
    color:var(--ink);text-shadow:3px 3px 0 rgba(0,0,0,.55);
    display:block;
  }
  .poster .plate .s{
    font-family:'Bungee',cursive;font-size:12px;letter-spacing:.12em;
    color:var(--card-accent,var(--amber));margin-top:8px;display:block;
    text-shadow:2px 2px 0 rgba(0,0,0,.5);
  }
  .poster::after{ /* scanlines + glass */
    content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
    background:
      repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.22) 2px 3px),
      radial-gradient(120% 80% at 50% 0%, rgba(255,255,255,.06), transparent 55%);
  }

  .card .body{padding:18px 18px 20px;display:flex;flex-direction:column;gap:12px;flex:1}
  .card .body .meta{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    font-family:'DM Mono',monospace;font-size:11.5px;color:var(--dim);
  }
  .card .body .meta .num{color:var(--dimmer)}
  .card .body .meta .yr{color:var(--card-accent,var(--amber))}
  .card .body h3{
    font-family:'Fredoka',sans-serif;font-weight:600;font-size:19px;color:var(--ink);
    line-height:1.25;
  }
  .card .body p{font-size:13.5px;color:var(--dim);line-height:1.55;flex:1}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tags span{
    font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.02em;
    color:var(--dim);background:var(--bg-2);border:1px solid var(--line);
    border-radius:6px;padding:3px 8px;text-transform:lowercase;
  }
  .play{
    margin-top:4px;align-self:flex-start;
    font-family:'Bungee',cursive;font-size:12px;letter-spacing:.05em;
    text-decoration:none;
    background:var(--amber);color:#1c1204;
    border:none;border-radius:9px;padding:11px 18px;
    transition:transform .1s ease, background .12s ease;
    box-shadow:0 4px 0 var(--amber-deep);
  }
  .play:hover{background:var(--pink);box-shadow:0 4px 0 #7c1f38;color:#1a0d12}
  .play:active{transform:translateY(3px);box-shadow:0 1px 0 var(--amber-deep)}
  .play:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

  /* ghost / coming-soon card */
  .card.soon{
    background:transparent;border:1px dashed var(--line);
    align-items:center;justify-content:center;text-align:center;
    padding:40px 24px;min-height:220px;gap:10px;color:var(--dim);
  }
  .card.soon:hover{transform:none;border-color:var(--dimmer);box-shadow:none}
  .card.soon .big{font-family:'Bungee',cursive;font-size:34px;color:var(--dimmer);line-height:1}
  .card.soon .txt{font-size:13px;max-width:22ch}

  /* ---------- footer ---------- */
  footer{border-top:1px solid var(--line);padding:26px 0 46px}
  footer .row{
    display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;
    font-family:'DM Mono',monospace;font-size:12px;color:var(--dim);
  }
  footer a{color:var(--dim);text-decoration:none;border-bottom:1px solid var(--line)}
  footer a:hover{color:var(--amber);border-color:var(--amber)}

  /* subtle CRT flicker on the hero title */
  @keyframes flick{
    0%,100%{opacity:1} 92%{opacity:1} 93%{opacity:.72} 94%{opacity:1}
    96%{opacity:.86} 97%{opacity:1}
  }
  .hero h1 .flick{animation:flick 6s steps(1,end) infinite}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    html{scroll-behavior:auto}
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <span class="mark">TOMI<b>·</b>ARCADE</span>
      <span class="by">por <a href="https://github.com/tomi2015" target="_blank" rel="noopener">tomi2015</a> · programado con Claude</span>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="eyebrow">Sala de máquinas</div>
      <h1>TOMI <span class="flick">ARCADE</span></h1>
      <p class="lead"><b>Los juegos que he hecho, en un solo sitio.</b> Elige una máquina, dale a <b>JUGAR</b> y no cierres los ojos.</p>
    </section>

    <section id="games">
      <div class="section-head">
        <h2>Máquinas</h2>
        <div class="rule"></div>
        <div class="count" id="count">—</div>
      </div>
      <div class="grid" id="grid"></div>
    </section>
  </main>
</div>

<footer>
  <div class="wrap">
    <div class="row">
      <span>© <span id="year">2026</span> tomi2015</span>
      <span><a href="https://github.com/tomi2015" target="_blank" rel="noopener">GitHub</a> · <a href="https://claude.com/claude-code" target="_blank" rel="noopener">hecho con Claude Code</a></span>
    </div>
  </div>
</footer>

<script>
/* ============================================================
   AÑADIR UN JUEGO NUEVO
   ------------------------------------------------------------
   Copia un bloque { ... } dentro de GAMES y rellénalo:

     title  : nombre del juego
     sub    : subtítulo corto (sale en la pantallita). "" si no hay
     tags   : géneros / palabras clave  (array de textos)
     year   : año
     desc   : una o dos frases
     url    : enlace para jugar (se abre en pestaña nueva)
     motif  : un emoji grande de fondo en la pantallita
     theme  : { g1, g2, accent } colores de la pantallita

   Guarda, haz commit y push:  Vercel lo publica solo.
   ============================================================ */
const GAMES = [
  {
    title: "Wonderland: El Coma",
    sub:   "El Coma",
    tags:  ["terror", "aventura", "niveles", "bossfights"],
    year:  2026,
    desc:  "Tienes cáncer, entras en coma y despiertas en Wonderland: una feria en ruinas que no te deja salir. Recoge Lumins para el Gusano antes de que el reloj llegue a cero… o Wonder despierta.",
    url:   "/wonderland/",
    motif: "🎪",
    theme: { g1: "#241436", g2: "#3a1420", accent: "#e8b24a" }
  },
];

const grid  = document.getElementById('grid');
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

GAMES.forEach((g, i) => {
  const th = g.theme || {};
  const card = document.createElement('article');
  card.className = 'card';
  card.style.setProperty('--g1', th.g1 || '#241a3a');
  card.style.setProperty('--g2', th.g2 || '#150e22');
  card.style.setProperty('--card-accent', th.accent || 'var(--amber)');
  card.innerHTML = `
    <div class="poster">
      <span class="motif" aria-hidden="true">${esc(g.motif || '🕹️')}</span>
      <span class="plate">
        <span class="t">${esc(g.title.split(':')[0].trim())}</span>
        ${g.sub ? `<span class="s">${esc(g.sub)}</span>` : ''}
      </span>
    </div>
    <div class="body">
      <div class="meta">
        <span class="num">Nº ${String(i + 1).padStart(2, '0')}</span>
        <span class="yr">${esc(g.year)}</span>
      </div>
      <h3>${esc(g.title)}</h3>
      <p>${esc(g.desc)}</p>
      <div class="tags">${(g.tags || []).map(t => `<span>${esc(t)}</span>`).join('')}</div>
      <a class="play" href="${esc(g.url)}" target="_blank" rel="noopener">Jugar ▶</a>
    </div>`;
  grid.appendChild(card);
});

// coming-soon ghost card
const soon = document.createElement('div');
soon.className = 'card soon';
soon.innerHTML = `<div class="big">+</div><div class="txt">Más máquinas en camino. Esto es solo el principio.</div>`;
grid.appendChild(soon);

document.getElementById('count').textContent =
  GAMES.length + (GAMES.length === 1 ? ' juego' : ' juegos');
document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
