<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tomi Arcade</title>
<meta name="description" content="Entra, elige una máquina y juega.">
<meta property="og:title" content="Tomi Arcade">
<meta property="og:description" content="Entra, elige una máquina y juega.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Shade&family=Fredoka:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230c0910'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23f0a53a'/%3E%3Cg stroke='%23f0a53a' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M16 3v4M16 25v4M3 16h4M25 16h4M6.5 6.5l3 3M22.5 22.5l3 3M25.5 6.5l-3 3M9.5 22.5l-3 3'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0a0710; --bg-2:#130e1c; --panel:#161120; --panel-2:#1d1729; --line:#2c2440;
    --ink:#f3ebdc; --dim:#968ca6; --dimmer:#5f5674;
    --amber:#f0a53a; --amber-deep:#8a5a17; --pink:#ff4f86; --cyan:#4fe0f0; --violet:#9b6bff;
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Fredoka',system-ui,-apple-system,sans-serif;
    font-weight:400; line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100dvh; overflow-x:hidden;
  }
  ::selection{background:var(--amber);color:#1a1206}
  a{color:inherit}
  .wrap{max-width:1120px;margin:0 auto;padding:0 clamp(16px,5vw,40px);position:relative;z-index:2}

  /* ---------- animated backdrop: starfield canvas + glow blobs ---------- */
  #stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  .glow{position:fixed;border-radius:50%;filter:blur(90px);opacity:.35;z-index:0;pointer-events:none;animation:drift 18s ease-in-out infinite alternate}
  .glow.a{width:520px;height:520px;background:#7b2cff;top:-160px;right:-120px}
  .glow.b{width:460px;height:460px;background:#ff3d7f;bottom:-180px;left:-140px;animation-delay:-6s;opacity:.25}
  .glow.c{width:360px;height:360px;background:#f0a53a;top:40%;left:55%;animation-delay:-12s;opacity:.12}
  @keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(-40px,30px) scale(1.12)}}

  /* ---------- header ---------- */
  header{padding:22px 0 0;display:flex;align-items:center;justify-content:space-between;gap:14px}
  .mark{font-family:'Bungee',cursive;font-size:clamp(18px,3.2vw,24px);letter-spacing:.02em;text-decoration:none}
  .mark b{color:var(--amber)}
  .music{
    display:flex;align-items:center;gap:10px;cursor:pointer;
    font-family:'DM Mono',monospace;font-size:12px;color:var(--ink);
    background:rgba(22,17,32,.8);border:1px solid var(--line);border-radius:999px;
    padding:8px 14px 8px 12px;backdrop-filter:blur(8px);
    transition:border-color .15s, box-shadow .15s, transform .1s;
  }
  .music:hover{border-color:var(--cyan);box-shadow:0 0 18px -4px var(--cyan)}
  .music:active{transform:scale(.97)}
  .music:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
  .eq{display:flex;align-items:flex-end;gap:2px;height:14px;width:18px}
  .eq i{flex:1;background:var(--cyan);border-radius:1px;height:30%;transition:height .2s}
  .music.on .eq i{animation:eq .9s ease-in-out infinite}
  .music.on .eq i:nth-child(2){animation-delay:-.3s}
  .music.on .eq i:nth-child(3){animation-delay:-.6s}
  .music.on .eq i:nth-child(4){animation-delay:-.15s}
  @keyframes eq{0%,100%{height:25%}50%{height:100%}}
  .music:not(.on){animation:nudge 2.4s ease-in-out infinite}
  @keyframes nudge{0%,80%,100%{box-shadow:0 0 0 0 rgba(79,224,240,0)}90%{box-shadow:0 0 0 6px rgba(79,224,240,.18)}}

  /* ---------- hero ---------- */
  .hero{padding:clamp(48px,11vw,110px) 0 clamp(40px,7vw,70px);text-align:center;position:relative}
  .coin{
    display:inline-flex;align-items:center;gap:8px;
    font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--amber);
    margin-bottom:22px;
  }
  .coin .blink{animation:blink 1.1s steps(1,end) infinite}
  @keyframes blink{50%{opacity:0}}
  .hero h1{
    font-family:'Bungee Shade','Bungee',cursive;font-weight:400;
    font-size:clamp(46px,13vw,132px);line-height:.9;letter-spacing:-.01em;
    color:var(--ink);
    text-shadow:0 0 28px rgba(155,107,255,.35);
  }
  .hero h1 .neon{
    display:block;
    background:linear-gradient(90deg,var(--amber),var(--pink),var(--violet),var(--cyan),var(--amber));
    background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shift 8s linear infinite;
    filter:drop-shadow(0 0 18px rgba(255,79,134,.35));
  }
  @keyframes shift{to{background-position:300% 0}}
  .hero p.lead{margin:26px auto 0;max-width:46ch;font-size:clamp(15px,2vw,18px);color:var(--dim)}
  .hero .lead b{color:var(--ink);font-weight:500}
  .hero .cta{
    margin-top:30px;display:inline-flex;align-items:center;gap:10px;
    font-family:'Bungee',cursive;font-size:14px;letter-spacing:.05em;text-decoration:none;
    background:var(--amber);color:#1c1204;border-radius:12px;padding:14px 24px;
    box-shadow:0 5px 0 var(--amber-deep),0 0 30px -6px rgba(240,165,58,.6);
    transition:transform .1s, background .12s, box-shadow .12s;
  }
  .hero .cta:hover{background:var(--pink);box-shadow:0 5px 0 #7c1f38,0 0 34px -4px rgba(255,79,134,.7)}
  .hero .cta:active{transform:translateY(4px);box-shadow:0 1px 0 var(--amber-deep)}

  /* synthwave floor under the hero */
  .floor{
    position:absolute;left:50%;bottom:-10px;width:140vw;height:180px;transform:translateX(-50%);
    perspective:260px;pointer-events:none;z-index:-1;
    mask-image:linear-gradient(to top,#000 10%,transparent 95%);
    -webkit-mask-image:linear-gradient(to top,#000 10%,transparent 95%);
  }
  .floor::before{
    content:"";position:absolute;inset:0 0 -100% 0;
    background-image:
      linear-gradient(rgba(255,79,134,.55) 2px,transparent 2px),
      linear-gradient(90deg,rgba(155,107,255,.45) 2px,transparent 2px);
    background-size:60px 60px;
    transform:rotateX(62deg);transform-origin:bottom;
    animation:roll 2.4s linear infinite;
  }
  @keyframes roll{to{background-position:0 60px}}

  /* ---------- games ---------- */
  .section-head{display:flex;align-items:center;gap:16px;margin:30px 0 28px}
  .section-head h2{font-family:'Bungee',cursive;font-weight:400;font-size:clamp(16px,2.4vw,21px);letter-spacing:.04em;white-space:nowrap}
  .section-head .rule{flex:1;height:2px;background:linear-gradient(90deg,var(--pink),var(--violet) 40%,transparent)}
  .section-head .count{font-family:'DM Mono',monospace;font-size:12px;color:var(--dim)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:clamp(18px,3vw,30px);padding-bottom:80px}

  .card{
    position:relative;display:flex;flex-direction:column;
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
    transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    transform-style:preserve-3d;
  }
  .card:hover{
    border-color:var(--card-accent,var(--amber));
    box-shadow:0 24px 50px -22px rgba(0,0,0,.9),0 0 38px -12px var(--card-accent,var(--amber));
  }
  .badge{
    position:absolute;top:14px;left:14px;z-index:5;
    font-family:'Bungee',cursive;font-size:11px;letter-spacing:.08em;
    background:var(--pink);color:#fff;border-radius:7px;padding:4px 9px;
    box-shadow:0 3px 0 #7c1f38;transform:rotate(-4deg);
    animation:bob 1.8s ease-in-out infinite;
  }
  @keyframes bob{50%{transform:rotate(-4deg) translateY(-3px)}}

  .poster{
    position:relative;aspect-ratio:16/10;display:grid;place-items:center;
    background:var(--poster, linear-gradient(150deg,var(--g1,#241a3a),var(--g2,#150e22)));
    border-bottom:1px solid var(--line);overflow:hidden;
  }
  .poster .motif{
    position:absolute;font-size:clamp(120px,24vw,190px);line-height:1;
    opacity:.2;transform:rotate(-8deg) scale(1);pointer-events:none;user-select:none;
    transition:transform .5s cubic-bezier(.2,.8,.2,1), opacity .3s;
  }
  .card:hover .poster .motif{transform:rotate(4deg) scale(1.12);opacity:.3}
  .poster .plate{position:relative;text-align:center;padding:0 18px;z-index:2;transition:transform .3s}
  .card:hover .poster .plate{transform:scale(1.05)}
  .poster .plate .t{font-family:'Bungee',cursive;font-size:clamp(22px,4.4vw,32px);line-height:1;text-shadow:3px 3px 0 rgba(0,0,0,.6);display:block}
  .poster .plate .s{font-family:'Bungee',cursive;font-size:12px;letter-spacing:.12em;color:var(--card-accent,var(--amber));margin-top:9px;display:block;text-shadow:2px 2px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
  .poster::after{
    content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
    background:
      repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.2) 2px 3px),
      radial-gradient(120% 80% at 50% 0%, rgba(255,255,255,.08), transparent 55%);
  }
  .poster .shine{
    position:absolute;inset:0;z-index:4;pointer-events:none;
    background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.14) 50%,transparent 65%);
    transform:translateX(-120%);transition:transform .7s ease;
  }
  .card:hover .poster .shine{transform:translateX(120%)}

  .card .body{padding:18px 20px 22px;display:flex;flex-direction:column;gap:12px;flex:1}
  .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:'DM Mono',monospace;font-size:11.5px;color:var(--dim)}
  .meta .num{color:var(--dimmer)}
  .meta .yr{color:var(--card-accent,var(--amber))}
  .card h3{font-weight:600;font-size:20px;line-height:1.25}
  .card .body p{font-size:13.5px;color:var(--dim);line-height:1.55;flex:1}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tags span{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--dim);background:var(--bg-2);border:1px solid var(--line);border-radius:6px;padding:3px 8px;text-transform:lowercase}
  .play{
    margin-top:6px;align-self:flex-start;
    font-family:'Bungee',cursive;font-size:12.5px;letter-spacing:.05em;text-decoration:none;
    background:var(--card-accent,var(--amber));color:#150d04;border-radius:10px;padding:11px 20px;
    box-shadow:0 4px 0 rgba(0,0,0,.45);
    transition:transform .1s, filter .12s, box-shadow .12s;
  }
  .play:hover{filter:brightness(1.12);box-shadow:0 4px 0 rgba(0,0,0,.45),0 0 22px -4px var(--card-accent,var(--amber))}
  .play:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
  .play:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

  .card.soon{
    background:rgba(22,17,32,.35);border:2px dashed var(--line);
    align-items:center;justify-content:center;text-align:center;
    padding:40px 24px;min-height:240px;gap:10px;color:var(--dim);
  }
  .card.soon:hover{border-color:var(--dimmer);box-shadow:none}
  .card.soon .big{font-family:'Bungee',cursive;font-size:40px;color:var(--dimmer);line-height:1;animation:blink 2.2s steps(1,end) infinite}
  .card.soon .txt{font-size:13px;max-width:24ch}

  /* reveal-on-scroll */
  .reveal{opacity:0;transform:translateY(24px);transition:opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1)}
  .reveal.in{opacity:1;transform:none}

  /* ---------- footer ---------- */
  footer{position:relative;z-index:2;border-top:1px solid var(--line);padding:26px 0 46px;background:rgba(10,7,16,.6)}
  footer .row{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;font-family:'DM Mono',monospace;font-size:12px;color:var(--dim)}
  footer .hint{color:var(--dimmer)}

  @media (max-width:520px){
    .music .lbl{display:none}
    .music{padding:9px 12px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    html{scroll-behavior:auto}
    .reveal{opacity:1;transform:none}
  }
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="glow a"></div><div class="glow b"></div><div class="glow c"></div>

<div class="wrap">
  <header>
    <a class="mark" href="/">TOMI<b>·</b>ARCADE</a>
    <button class="music" id="musicBtn" type="button" aria-pressed="false" title="Música (M)">
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="lbl" id="musicLbl">Música: off</span>
    </button>
  </header>

  <main>
    <section class="hero">
      <div class="coin"><span class="blink">●</span> Insert coin <span class="blink">●</span></div>
      <h1>TOMI <span class="neon">ARCADE</span></h1>
      <p class="lead"><b>Los juegos que he hecho, en un solo sitio.</b> Elige una máquina, dale a <b>JUGAR</b> y no cierres los ojos.</p>
      <a class="cta" href="#games">Ver máquinas ▼</a>
      <div class="floor" aria-hidden="true"></div>
    </section>

    <section id="games">
      <div class="section-head">
        <h2>Máquinas</h2>
        <div class="rule"></div>
        <div class="count" id="count">—</div>
      </div>
      <div class="grid" id="grid"></div>
    </section>
  </main>
</div>

<footer>
  <div class="wrap">
    <div class="row">
      <span>© <span id="year">2026</span> Tomi Arcade</span>
      <span class="hint">Pulsa M para la música</span>
    </div>
  </div>
</footer>

<script>
/* ============================================================
   AÑADIR UN JUEGO NUEVO
   ------------------------------------------------------------
   Copia un bloque { ... } dentro de GAMES y rellénalo:

     title  : nombre del juego
     sub    : subtítulo corto (sale en la pantallita). "" si no hay
     tags   : géneros / palabras clave  (array de textos)
     year   : año
     desc   : una o dos frases
     url    : enlace para jugar (se abre en pestaña nueva)
     motif  : un emoji grande de fondo en la pantallita
     theme  : { g1, g2, accent } colores de la pantallita
              (opcional: poster = cualquier "background" CSS)
     badge  : texto de la etiqueta de esquina, p. ej. "NUEVO" (opcional)

   Guarda, haz commit y push:  Vercel lo publica solo.
   ============================================================ */
const GAMES = [
  {
    title: "Super Easy Obby",
    sub:   "¿Seguro que es fácil?",
    tags:  ["obby", "terror", "plataformas", "6 personajes"],
    year:  2026,
    desc:  "Un obby feliz con cielo azul y música alegre… hasta que conoces a Meowl. Activa balizas en un tablero de ajedrez mientras los monstruos se acumulan ronda tras ronda.",
    url:   "/super-easy-obby/",
    motif: "🦉",
    badge: "NUEVO",
    theme: { accent: "#4fe0f0",
             poster: "linear-gradient(135deg,#7ec8f5 0%,#bfe6ff 46%,#3a0a10 54%,#0d0204 100%)" }
  },
  {
    title: "Wonderland: El Coma",
    sub:   "El Coma",
    tags:  ["terror", "aventura", "niveles", "bossfights"],
    year:  2026,
    desc:  "Tienes cáncer, entras en coma y despiertas en Wonderland: una feria en ruinas que no te deja salir. Recoge Lumins para el Gusano antes de que el reloj llegue a cero… o Wonder despierta.",
    url:   "/wonderland/",
    motif: "🎪",
    theme: { g1: "#241436", g2: "#3a1420", accent: "#e8b24a" }
  },
];

const grid = document.getElementById('grid');
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

GAMES.forEach((g, i) => {
  const th = g.theme || {};
  const card = document.createElement('article');
  card.className = 'card reveal';
  card.style.setProperty('--g1', th.g1 || '#241a3a');
  card.style.setProperty('--g2', th.g2 || '#150e22');
  if (th.poster) card.style.setProperty('--poster', th.poster);
  card.style.setProperty('--card-accent', th.accent || 'var(--amber)');
  card.innerHTML = `
    ${g.badge ? `<span class="badge">${esc(g.badge)}</span>` : ''}
    <div class="poster">
      <span class="motif" aria-hidden="true">${esc(g.motif || '🕹️')}</span>
      <span class="plate">
        <span class="t">${esc(g.title.split(':')[0].trim())}</span>
        ${g.sub ? `<span class="s">${esc(g.sub)}</span>` : ''}
      </span>
      <span class="shine"></span>
    </div>
    <div class="body">
      <div class="meta">
        <span class="num">Nº ${String(i + 1).padStart(2, '0')}</span>
        <span class="yr">${esc(g.year)}</span>
      </div>
      <h3>${esc(g.title)}</h3>
      <p>${esc(g.desc)}</p>
      <div class="tags">${(g.tags || []).map(t => `<span>${esc(t)}</span>`).join('')}</div>
      <a class="play" href="${esc(g.url)}" target="_blank" rel="noopener">Jugar ▶</a>
    </div>`;
  grid.appendChild(card);
});

const soon = document.createElement('div');
soon.className = 'card soon reveal';
soon.innerHTML = `<div class="big">+</div><div class="txt">Más máquinas en camino. Esto es solo el principio.</div>`;
grid.appendChild(soon);

document.getElementById('count').textContent = GAMES.length + (GAMES.length === 1 ? ' juego' : ' juegos');
document.getElementById('year').textContent = new Date().getFullYear();

// ---- reveal cards on scroll ----
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
}), { threshold: .12 }) : null;
document.querySelectorAll('.reveal').forEach((el, i) => {
  el.style.transitionDelay = (i * 80) + 'ms';
  io ? io.observe(el) : el.classList.add('in');
});

// ---- subtle 3D tilt on cards (desktop pointers only) ----
if (matchMedia('(hover:hover) and (pointer:fine)').matches && !matchMedia('(prefers-reduced-motion:reduce)').matches) {
  document.querySelectorAll('.card:not(.soon)').forEach(card => {
    card.addEventListener('pointermove', e => {
      const r = card.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
      card.style.transform = `translateY(-6px) rotateX(${(-y * 6).toFixed(2)}deg) rotateY(${(x * 8).toFixed(2)}deg)`;
    });
    card.addEventListener('pointerleave', () => { card.style.transform = ''; });
  });
}

// ---- starfield ----
(() => {
  const cv = document.getElementById('stars'), c = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
  let W, H, stars = [];
  function size() {
    const dpr = Math.min(2, devicePixelRatio || 1);
    W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr;
    const n = Math.round(innerWidth * innerHeight / 7000);
    stars = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, z: Math.random() * .8 + .2, tw: Math.random() * 6.28 }));
  }
  size(); addEventListener('resize', size);
  const cols = ['#ffffff', '#4fe0f0', '#ff4f86', '#f0a53a', '#9b6bff'];
  function draw(t) {
    c.clearRect(0, 0, W, H);
    for (const s of stars) {
      if (!reduce) { s.y += s.z * .35; if (s.y > H) { s.y = 0; s.x = Math.random() * W; } }
      const a = .35 + Math.sin(t * .002 + s.tw) * .3;
      c.globalAlpha = Math.max(0, a) * s.z;
      c.fillStyle = cols[Math.floor(s.tw * 10) % cols.length];
      const r = s.z * 1.6;
      c.fillRect(s.x, s.y, r, r);
    }
    c.globalAlpha = 1;
    if (!reduce) requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();

// ---- musiquita: little synthwave loop made with WebAudio (no files) ----
const Music = (() => {
  let ac = null, out = null, timer = null, step = 0, next = 0, on = false;
  const BPM = 104, S = 60 / BPM / 4; // sixteenth notes
  const n = m => 440 * Math.pow(2, (m - 69) / 12);
  // Am – F – C – G
  const CH = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]];
  const BASS = [45, 41, 48, 43];
  const LEAD = [ // 32 sixteenths per bar pair, midi or 0
    76,0,0,74, 72,0,69,0, 72,0,74,0, 76,0,0,0,   77,0,76,0, 74,0,72,0, 74,0,0,72, 69,0,0,0,
    76,0,0,79, 81,0,79,0, 76,0,74,0, 72,0,0,0,   74,0,72,0, 71,0,67,0, 71,0,74,0, 71,0,0,0 ];
  function init() {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ac.createDynamicsCompressor();
    out = ac.createGain(); out.gain.value = 0;
    // soft echo for that arcade-hall feel
    const dl = ac.createDelay(1), fb = ac.createGain(), wet = ac.createGain();
    dl.delayTime.value = S * 3; fb.gain.value = .32; wet.gain.value = .25;
    out.connect(comp); out.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(comp);
    comp.connect(ac.destination);
  }
  function v(t, f, dur, type, vol, lp) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    let node = o;
    if (lp) { const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = lp; o.connect(fl); node = fl; }
    node.connect(g); g.connect(out); o.start(t); o.stop(t + dur + .05);
  }
  function hat(t, vol) {
    const len = ac.sampleRate * .05, b = ac.createBuffer(1, len, ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = b; f.type = 'highpass'; f.frequency.value = 7000; g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(out); s.start(t);
  }
  function kick(t) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(40, t + .15);
    g.gain.setValueAtTime(.35, t); g.gain.exponentialRampToValueAtTime(.0001, t + .22);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + .25);
  }
  function tick() {
    while (next < ac.currentTime + .15) {
      const bar = Math.floor(step / 16) % 4, s16 = step % 16, t = next;
      if (s16 % 2 === 0) { const ch = CH[bar]; v(t, n(ch[(s16 / 2) % 3] + 12), S * 1.8, 'triangle', .045); }
      if (s16 === 0) CH[bar].forEach(m => v(t, n(m), S * 15, 'sawtooth', .018, 900));
      if (s16 % 4 === 0) v(t, n(BASS[bar] - 12), S * 3.5, 'square', .06, 420);
      const l = LEAD[step % LEAD.length]; if (l && step >= 64) v(t, n(l), S * 2.4, 'square', .03, 2400);
      if (s16 % 8 === 0) kick(t);
      if (s16 % 4 === 2) hat(t, .05);
      step++; next += S;
    }
  }
  function start() {
    if (!ac) init();
    ac.resume();
    if (!timer) { next = ac.currentTime + .08; timer = setInterval(tick, 30); }
    out.gain.cancelScheduledValues(ac.currentTime);
    out.gain.setTargetAtTime(.8, ac.currentTime, .4);
    on = true;
  }
  function stop() {
    if (!ac) { on = false; return; }
    out.gain.setTargetAtTime(0, ac.currentTime, .15);
    on = false;
    setTimeout(() => { if (!on && timer) { clearInterval(timer); timer = null; } }, 700);
  }
  function blip(f) { // tiny UI sounds, only while music is on
    if (!ac || !on) return;
    const t = ac.currentTime; v(t, f, .08, 'square', .03, 3000); v(t + .05, f * 1.5, .1, 'square', .025, 3000);
  }
  return { start, stop, blip, get on() { return on; } };
})();

const musicBtn = document.getElementById('musicBtn'), musicLbl = document.getElementById('musicLbl');
function readPref() { try { return localStorage.getItem('tomiArcadeMusic'); } catch (e) { return null; } }
function savePref(v) { try { localStorage.setItem('tomiArcadeMusic', v); } catch (e) {} }
function setMusic(onNow) {
  onNow ? Music.start() : Music.stop();
  musicBtn.classList.toggle('on', onNow);
  musicBtn.setAttribute('aria-pressed', onNow);
  musicLbl.textContent = onNow ? 'Música: on' : 'Música: off';
  savePref(onNow ? 'on' : 'off');
}
musicBtn.addEventListener('click', e => { e.stopPropagation(); setMusic(!Music.on); });
addEventListener('keydown', e => { if (e.key.toLowerCase() === 'm' && !e.repeat) setMusic(!Music.on); });
// browsers block autoplay: start on the first interaction unless the visitor turned it off before
const firstTouch = (e) => {
  removeEventListener('pointerdown', firstTouch);
  if (musicBtn.contains(e.target)) return; // the button's own click handles it
  if (readPref() !== 'off' && !Music.on) setMusic(true);
};
addEventListener('pointerdown', firstTouch);
// hush while a game tab has focus, come back when the visitor returns
let pausedByHide = false;
document.addEventListener('visibilitychange', () => {
  if (document.hidden && Music.on) { pausedByHide = true; Music.stop(); }
  else if (!document.hidden && pausedByHide) { pausedByHide = false; Music.start(); }
});
document.querySelectorAll('.play, .cta').forEach(a => {
  a.addEventListener('mouseenter', () => Music.blip(880));
  a.addEventListener('click', () => Music.blip(1320));
});
</script>
